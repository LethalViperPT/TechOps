<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stremio TV</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #171821; }
        iframe { width: 100%; height: 100%; border: none; }
        #loading { 
            position: absolute; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #2c2d46 0%, #171821 100%);
            color: white; font-family: sans-serif; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="loading">
        <h1 style="color: #7b5be4;">STREMIO</h1>
        <p>A carregar interface...</p>
    </div>

    <iframe src="https://web.stremio.com/" onload="document.getElementById('loading').style.display='none';"></iframe>

</body>
</html>
