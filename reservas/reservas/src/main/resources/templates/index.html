<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WorkSpace - Gestão de Espaços</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* Fundo e tipografia principal */
        body.bg-light { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%) !important; min-height: 100vh; padding-bottom: 50px; }
        .hero-title { color: #ffffff; text-shadow: 2px 2px 8px rgba(0,0,0,0.4); font-weight: 800; font-size: 3.5rem; letter-spacing: -1px; }
        .hero-subtitle { color: #e0e0e0; font-size: 1.2rem; margin-bottom: 3rem; font-weight: 300; }

        /* Comportamento dos cartões */
        .card { background: rgba(255, 255, 255, 0.98) !important; border-radius: 15px !important; border: none !important; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25) !important; transition: transform 0.3s ease; overflow: hidden; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.4) !important; }

        /* Altura fixa para as imagens não desformatarem o ecrã */
        .card-img-top { height: 220px; object-fit: cover; border-bottom: 3px solid #f8f9fa; }

        /* Botões */
        .btn { border-radius: 8px !important; font-weight: 600 !important; transition: all 0.3s ease !important; }
        .btn:hover { box-shadow: 0 6px 15px rgba(0,0,0,0.3) !important; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5 text-center">

    <!-- Novo Título e Subtítulo -->
    <h1 class="hero-title mt-4"><i class="bi bi-buildings me-3"></i>WorkSpace</h1>
    <p class="hero-subtitle">Gestão Inteligente de Espaços e Reservas Corporativas</p>

    <div class="row justify-content-center mt-5">
        <!-- Cartão Gestão de Salas -->
        <div class="col-md-5 mb-4">
            <div class="card h-100">
                <!-- Fotografia embutida direta via Unsplash -->
                <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Sala de Reuniões">
                <div class="card-body p-4">
                    <h3 class="card-title text-dark fw-bold"><i class="bi bi-door-open text-primary me-2"></i>Salas</h3>
                    <p class="card-text text-muted mb-4 mt-2">Configure, edite e gira os espaços de reunião disponíveis na sua organização.</p>
                    <a href="/salas" class="btn btn-primary w-100 py-3 fs-5">Entrar nas Salas</a>
                </div>
            </div>
        </div>

        <!-- Cartão Gestão de Reservas -->
        <div class="col-md-5 mb-4">
            <div class="card h-100">
                <!-- Fotografia embutida direta via Unsplash -->
                <img src="https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?auto=format&fit=crop&w=600&q=80" class="card-img-top" alt="Agenda e Planeamento">
                <div class="card-body p-4">
                    <h3 class="card-title text-dark fw-bold"><i class="bi bi-calendar-check text-success me-2"></i>Reservas</h3>
                    <p class="card-text text-muted mb-4 mt-2">Consulte a disponibilidade de calendário e efetue novas marcações.</p>
                    <a href="/reservas" class="btn btn-success w-100 py-3 fs-5">Gerir Reservas</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
