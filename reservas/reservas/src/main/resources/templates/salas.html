<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WorkSpace - Gestão de Salas</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Biblioteca de ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body.bg-light { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%) !important; min-height: 100vh; padding-bottom: 50px; }
        .page-title { color: #ffffff !important; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); font-weight: 800; }

        .card { background: rgba(255, 255, 255, 0.98) !important; border-radius: 15px !important; border: none !important; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25) !important; }
        .table { border-radius: 10px; overflow: hidden; margin-bottom: 0 !important; }
        .table-dark { background-color: #2c3e50 !important; }

        .btn { border-radius: 8px !important; font-weight: 600 !important; transition: all 0.3s ease !important; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.3) !important; }
        .btn-light { color: #2b5876; background-color: rgba(255,255,255,0.9); }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">

    <!-- Cabeçalho com Ícone e Botão Voltar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title"><i class="bi bi-door-open me-3"></i>Gestão de Salas</h2>
        <a href="/" class="btn btn-light shadow-sm"><i class="bi bi-arrow-left me-2"></i>Voltar ao Início</a>
    </div>

    <!-- Formulário flutuante -->
    <div class="card mb-4">
        <div class="card-body p-4">
            <h5 class="mb-4 text-primary fw-bold"><i class="bi bi-plus-circle me-2"></i>Adicionar Nova Sala</h5>
            <form th:action="@{/salas/guardar}" th:object="${novaSala}" method="post" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label text-muted fw-bold small">Nome da Sala</label>
                    <input type="text" th:field="*{designacao}" class="form-control form-control-lg" placeholder="Ex: Auditório Principal" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted fw-bold small">Capacidade</label>
                    <input type="number" th:field="*{capacidade}" class="form-control form-control-lg" placeholder="Nº de pessoas" min="1" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-check2 me-2"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela flutuante -->
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover table-borderless m-0 align-middle">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4 py-3">ID</th>
                    <th class="py-3">Designação</th>
                    <th class="py-3">Capacidade</th>
                    <th class="text-center py-3">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sala : ${salas}">
                    <td class="ps-4 fw-bold text-muted" th:text="${sala.id}"></td>
                    <td class="fw-bold" th:text="${sala.designacao}"></td>
                    <td><i class="bi bi-people-fill text-muted me-2"></i><span th:text="${sala.capacidade} + ' pessoas'"></span></td>
                    <td class="text-center">
                        <a th:href="@{/salas/eliminar/{id}(id=${sala.id})}" class="btn btn-outline-danger btn-sm px-3"><i class="bi bi-trash3 me-1"></i>Remover</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(salas)}">
                    <td colspan="4" class="text-center text-muted py-5">
                        <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
                        Nenhuma sala registada no sistema.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
