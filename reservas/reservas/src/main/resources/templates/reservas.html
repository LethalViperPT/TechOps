<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WorkSpace - Gestão de Reservas</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Biblioteca de ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body.bg-light { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%) !important; min-height: 100vh; padding-bottom: 50px; }
        .page-title { color: #ffffff !important; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); font-weight: 800; }

        .card { background: rgba(255, 255, 255, 0.98) !important; border-radius: 15px !important; border: none !important; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25) !important; }
        .table { border-radius: 10px; overflow: hidden; margin-bottom: 0 !important; }
        .table-dark { background-color: #2c3e50 !important; }

        .btn { border-radius: 8px !important; font-weight: 600 !important; transition: all 0.3s ease !important; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.3) !important; }
        .btn-light { color: #2b5876; background-color: rgba(255,255,255,0.9); }
        .alert { border-radius: 10px !important; border: none !important; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">

    <!-- Cabeçalho com Ícone e Botão Voltar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title"><i class="bi bi-calendar-check me-3"></i>Gestão de Reservas</h2>
        <a href="/" class="btn btn-light shadow-sm"><i class="bi bi-arrow-left me-2"></i>Voltar ao Início</a>
    </div>

    <!-- Alertas de Validação com Ícones -->
    <div th:if="${erro}" class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-3 fs-4"></i>
        <div th:text="${erro}" class="fw-bold"></div>
    </div>
    <div th:if="${sucesso}" class="alert alert-success d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill flex-shrink-0 me-3 fs-4"></i>
        <div th:text="${sucesso}" class="fw-bold"></div>
    </div>

    <!-- Formulário flutuante -->
    <div class="card mb-4">
        <div class="card-body p-4">
            <h5 class="mb-4 text-success fw-bold"><i class="bi bi-calendar-plus me-2"></i>Nova Marcação</h5>
            <form th:action="@{/reservas/guardar}" th:object="${novaReserva}" method="post" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-muted fw-bold small">Responsável</label>
                    <input type="text" th:field="*{nomeResponsavel}" class="form-control" placeholder="O seu nome" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted fw-bold small">Sala</label>
                    <select th:field="*{sala}" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option th:each="s : ${salas}" th:value="${s.id}" th:text="${s.designacao}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted fw-bold small">Data</label>
                    <input type="date" th:field="*{data}" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted fw-bold small">Hora Início</label>
                    <input type="time" th:field="*{horaInicio}" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted fw-bold small">Hora Fim</label>
                    <input type="time" th:field="*{horaFim}" class="form-control" required>
                </div>
                <div class="col-12 mt-4 text-end">
                    <button type="submit" class="btn btn-success btn-lg px-5"><i class="bi bi-calendar-check me-2"></i>Confirmar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela flutuante -->
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover table-borderless m-0 align-middle">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4 py-3">ID</th>
                    <th class="py-3">Responsável</th>
                    <th class="py-3">Sala</th>
                    <th class="py-3">Data</th>
                    <th class="py-3">Horário</th>
                    <th class="text-center py-3">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reserva : ${reservas}">
                    <td class="ps-4 fw-bold text-muted" th:text="${reserva.id}"></td>
                    <td class="fw-bold" th:text="${reserva.nomeResponsavel}"></td>
                    <td><i class="bi bi-door-open text-primary me-2"></i><span th:text="${reserva.sala.designacao}"></span></td>
                    <td><i class="bi bi-calendar-event text-muted me-2"></i><span th:text="${reserva.data}"></span></td>
                    <td><i class="bi bi-clock text-muted me-2"></i><span th:text="${reserva.horaInicio} + ' - ' + ${reserva.horaFim}"></span></td>
                    <td class="text-center">
                        <a th:href="@{/reservas/eliminar/{id}(id=${reserva.id})}" class="btn btn-outline-danger btn-sm px-3"><i class="bi bi-x-circle me-1"></i>Cancelar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservas)}">
                    <td colspan="6" class="text-center text-muted py-5">
                        <i class="bi bi-calendar-x fs-3 d-block mb-2"></i>
                        Nenhuma reserva agendada para os próximos dias.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
