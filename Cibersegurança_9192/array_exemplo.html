<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arrays Exemplo - Equipas</title>
</head>
<body>
    <h2>Listas Equipas de Futebol da Liga Portuguesa</h2>

    <input type="text" id="inserirequipa" placeholder="Nome da equipa">

    <button onclick="adicionarequipa()">Adicionar</button>
    <button onclick="adicionainiciorequipa()">Adicionar no início</button>
    <button onclick="Apagarprimeiroequipa()">Remover o Primeiro</button>
    <button onclick="Apagarultimoequipa()">Remover o Último</button>
    <button onclick="LimparLista()">Limpar tudo</button>
    <br><br>
    <input type="number" id="posicao" placeholder="introduza a posição a apagar">
    <button onclick="Apagarposicao()">Apagar Posição</button>

    <h3>Mostrar Equipas</h3>

    <div id="lista"></div>

<script>
    let equipas = [];

    function mostrarlista() 
    {
        let lista = document.getElementById("lista");
        lista.innerHTML = "";
        for(let i = 0; i < equipas.length; i++)
        {
            let item = document.createElement("div");
            item.textContent = i + " - " + equipas[i];
            lista.appendChild(item);
        }
    }

    function adicionarequipa() 
    {
        let input = document.getElementById("inserirequipa");
        let equipa = input.value;
        if (equipa !== "") 
        { 
            equipas.push(equipa);
            input.value = "";
            mostrarlista();
        }
    }
    
    
    function adicionainiciorequipa() 
    {
        let input = document.getElementById("inserirequipa");
        let equipa = input.value;
        if (equipa !== "") 
        {
            equipas.unshift(equipa);
            input.value = "";
            mostrarlista();
        }
    }

    function Apagarprimeiroequipa()
    {
        equipas.shift();
        mostrarlista();
    }

    function Apagarultimoequipa()
    {
        equipas.pop();
        mostrarlista();
    }

    function LimparLista()
    {
        equipas = [];
        mostrarlista();
    }

    function Apagarposicao()
    {
        let inputPosicao = document.getElementById("posicao");
        let posicao = inputPosicao.value;
        if (posicao !== "" && posicao >= 0 && posicao < equipas.length) 
        {
            equipas.splice(posicao, 1);
            inputPosicao.value = "";
            mostrarlista();
        } else 
        {
            alert("valor inválido");
        }
    }
</script>
</body>
</html>
