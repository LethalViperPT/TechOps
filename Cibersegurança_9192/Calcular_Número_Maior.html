<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calcular Número Maior</title>
</head>
<body>

    <h1>Calcular Número Maior</h1>

    <form name="maiorForm">
        <table border="1">
            <tr>
                <td>Número 1:</td>
                <td><input type="text" name="num1"></td>
            </tr>
            <tr>
                <td>Número 2:</td>
                <td><input type="text" name="num2"></td>
            </tr>
            <tr>
                <td>Resultado:</td>
                <td><input type="text" name="res" readonly></td>
            </tr>
        </table>
        <br>
        <button type="button" onclick="comparar()">Calcular Maior</button>
        <button type="button" onclick="limpar()">Limpar</button>
    </form>

    <script>
        function comparar() 
        {
            var n1 = parseInt(document.maiorForm.num1.value);
            var n2 = parseInt(document.maiorForm.num2.value);
            var resultado;

            if (n1 > n2) {
                resultado = n1;
            } else if (n2 > n1) {
                resultado = n2;
            } else {
                resultado = "São iguais";
            }

            document.maiorForm.res.value = resultado;
        }

        function limpar() 
        {
            document.maiorForm.num1.value = "";
            document.maiorForm.num2.value = "";
            document.maiorForm.res.value = "";
        }
    </script>

</body>
</html>
