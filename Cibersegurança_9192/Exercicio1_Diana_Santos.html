<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saudação por Hora</title>
</head>
<body onload="verificarHora()">

    <div id="relogio"></div>
    <div id="mensagem"></div>

    <script>
        function verificarHora() 
        {
            var datahora = new Date();
            var horas = datahora.getHours();
            var minutos = datahora.getMinutes();
            var segundos = datahora.getSeconds();
            
            var saudacao = "";

            document.getElementById("relogio").innerHTML = "Agora são " + horas + ":" + minutos + ":" + segundos;

            if (horas >= 6 && horas < 12) 
            {
                saudacao = "Bom dia";
            } 
            else if (horas >= 12 && horas < 20) 
            {
                saudacao = "Boa Tarde";
            } 
            else 
            {
                saudacao = "Boa Noite";
            }

            document.getElementById("mensagem").innerHTML = saudacao + " são " + horas + " horas";
        }
    </script>

</body>
</html>
