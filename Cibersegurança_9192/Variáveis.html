<!doctype html>
<html lang="en">
<html>
<head>
    <title> Variáveis em Javascript </title>
</head>
<body>
    <h3> Exemplo de Variáveis </h3>
    <script>
        var valor;
        var taxa=0.35;
        document.write ("taxa="+taxa, "<br>");
        dado="Ana";
        document.write ("dado="+dado, "<br>");
        dado=2007;
        document.write ("dado="+dado, "<br>");
        document.write (typeof dado, "<br>");
        dado="Ana";
        document.write (typeof dado);
    </script>
</body>
</html>
