<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3 - Empresa XPTO</title>
</head>
<body>

    <script>
        var nomes = ["Rui", "Pedro", "Alberto", "Maria", "Ana"];
        var brutos = [1000, 900, 2000, 1500, 850];
        var liquidos = [];
        
        var baixo = 0;
        var alto = 0;

        for (var i = 0; i < nomes.length; i = i + 1) 
        {
            var liq = 0;
            if (brutos[i] <= 1000) 
            {
                liq = brutos[i] * 0.8; 
            } 
            else 
            {
                liq = brutos[i] * 0.7;
            }
            
            liquidos.push(liq);

            if (liq <= 1000) 
            { 
                baixo = baixo + 1; 
            } 
            else 
            { 
                alto = alto + 1; 
            }
        }

        document.write("Nome dos funcionários e o seu salário bruto", "<br>");
        for (var j = 0; j < nomes.length; j = j + 1) 
        {
            document.write(nomes[j], "---", brutos[j], "<br>");
        }

        document.write("<br>", "Nome dos funcionários e o seu salário líquido", "<br>");
        for (var k = 0; k < nomes.length; k = k + 1) 
        {
            document.write(nomes[k], "---", liquidos[k], "<br>");
        }

        document.write("<br>", "Existem ", baixo, " funcionários com salário líquido inferior ou igual a 1000", "<br>");
        document.write("Existem ", alto, " funcionários com salário líquido superior a 1000", "<br>");
    </script>

</body>
</html>
