<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Avaliação de Notas</title>
</head>
<body>

    <h1>Avaliação de Alunos</h1>

    <form name="notaForm">
        <table border="1">
            <tr>
                <td>Nome do Aluno:</td>
                <td><input type="text" name="nome"></td>
            </tr>
            <tr>
                <td>Nota (1-20):</td>
                <td><input type="text" name="nota"></td>
            </tr>
            <tr>
                <td>Resultado:</td>
                <td><input type="text" name="res" size="40" readonly></td>
            </tr>
        </table>
        <br>
        <button type="button" onclick="avaliar()">Avaliar Nota</button>
    </form>

    <script>
        function avaliar() 
        {
            var nome = document.notaForm.nome.value;
            var nota = parseInt(document.notaForm.nota.value);
            var mencao = "";

            switch (true) 
            {
                case (nota >= 1 && nota <= 5):
                    mencao = "Fraco";
                    break;
                case (nota >= 6 && nota <= 9):
                    mencao = "Insuficiente";
                    break;
                case (nota >= 10 && nota <= 13):
                    mencao = "Suficiente";
                    break;
                case (nota >= 14 && nota <= 17):
                    mencao = "Bom";
                    break;
                case (nota >= 18 && nota <= 20):
                    mencao = "Muito Bom";
                    break;
                default:
                    mencao = "nota inválida";
            }

            if (mencao === "nota inválida") 
            {
                document.notaForm.res.value = mencao;
            } else 
            {
                document.notaForm.res.value = "O Aluno " + nome + " teve " + mencao;
            }
        }
    </script>

</body>
</html>
