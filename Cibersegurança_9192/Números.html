<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Números</title>
</head>
<body>

    <p>Clique na operação para calcular.</p>

    <button onclick="somar()">Somar</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>

    <br><br>

    <div id="resultado"></div>

    <script>
        function somar() 
        {
            var n1 = prompt("Digite o número 1:");
            var n2 = prompt("Digite o número 2:");
            var conta = parseInt(n1) + parseInt(n2);
            document.getElementById("resultado").innerHTML = conta;
        }

        function subtrair() 
        {
            var n1 = prompt("Digite o número 1:");
            var n2 = prompt("Digite o número 2:");
            var conta = n1 - n2;
            document.getElementById("resultado").innerHTML = conta;
        }

        function multiplicar() 
        {
            var n1 = prompt("Digite o número 1:");
            var n2 = prompt("Digite o número 2:");
            var conta = n1 * n2;
            document.getElementById("resultado").innerHTML = conta;
        }

        function dividir() 
        {
            var n1 = prompt("Digite o número 1:");
            var n2 = prompt("Digite o número 2:");
            if (n2 != 0) 
            {
                var conta = n1 / n2;
                document.getElementById("resultado").innerHTML = conta;
            } else 
            {
                alert("Não é possível dividir por zero!");
            }
        }
    </script>
</body>
</html>
