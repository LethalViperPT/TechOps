<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2 - Avaliação de Alunos</title>
</head>
<body>
    <h3>Avaliação de Alunos</h3>

    <table border="1">
        <tr>
            <td>Número</td>
            <td>Nota</td>
            <td>Situação</td>
        </tr>
        <script>
            var resposta = prompt("Digite o número de alunos:");
            var totalAlunos = parseInt(resposta);

            for (var i = 1; i <= totalAlunos; i = i + 1) 
            {
                var nota = Math.floor(Math.random() * 20);
                var situacao = "";

                if (nota < 5) { situacao = "Fraco"; }
                else if (nota >= 5 && nota <= 9) { situacao = "Insuficiente"; }
                else if (nota >= 10 && nota <= 13) { situacao = "Suficiente"; }
                else if (nota >= 14 && nota <= 17) { situacao = "Bom"; }
                else { situacao = "Muito Bom"; }

                document.write("<tr>");
                document.write("<td>", i, "</td>");
                document.write("<td>", nota, "</td>");
                document.write("<td>", situacao, "</td>");
                document.write("</tr>");
            }
        </script>
    </table>
</body>
</html>
